<script>
(function(){
var el=document.getElementById('categories-list');
if(!el)return;
var getCategoryIcon=function(icon){return (icon&&Icons[icon])?Icons[icon]:Icons.package;};
function render(){
el.innerHTML=AppData.categories.map(function(cat){
var realCount=AppData.products.filter(function(p){return p.categorySlug===cat.slug;}).length;
return '<a href="/shop?category='+cat.slug+'" class="category-page-card"><div class="category-page-card__icon">'+getCategoryIcon(cat.icon)+'</div><div class="category-page-card__name">'+cat.name+'</div><div class="category-page-card__count">'+realCount+' محصول</div><div class="category-page-card__desc">'+cat.description+'</div></a>';
}).join('');
}
render();
try{
if(AppData.catalogReady&&AppData.catalogReady.then)AppData.catalogReady.then(render);
document.addEventListener('camzy:catalog-updated',render);
}catch(e){}
})();
</script>
