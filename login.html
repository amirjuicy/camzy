<body class="auth-standalone">
  <header id="site-header" aria-hidden="true"></header>
  <div id="mobile-header" class="mobile-header" aria-hidden="true"></div>
  <main>
    <div class="auth-page">
      <div class="auth-box">
        <a class="auth-back" href="/"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>بازگشت به فروشگاه</a>
        <div class="auth-brand"><span class="auth-brand__badge" data-store-logo><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span><span class="auth-brand__name" data-setting="store.name">کمزی</span><span class="auth-brand__tag">کمزی | فروشگاه تخصصی دوربین مداربسته و سیستم‌های امنیتی</span></div>
        <h2 class="auth-box__title">ورود به حساب کاربری</h2>
        <p class="auth-subtitle">خوش برگشتید! برای ادامه وارد شوید.</p>
        <form id="login-form">
          <div id="login-password-form">
            <div class="form-group"><label class="input-label">موبایل یا ایمیل</label><input class="input" type="text" dir="ltr" placeholder="شماره موبایل یا ایمیل" id="login-identifier" required></div>
            <div class="form-group"><label class="input-label">رمز عبور</label><input class="input" type="password" placeholder="رمز عبور" id="login-password" required></div>
            <div class="auth-meta-row"><label class="filter-option"><input type="checkbox"><span style="font-size:var(--font-size-sm)">مرا به خاطر بسپار</span></label><a href="/forgot-password" class="auth-link">فراموشی رمز عبور</a></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">ورود</button>
          </div>
          <div id="login-otp-form" style="display:none">
            <div class="form-group"><label class="input-label">شماره موبایل</label><input class="input" type="tel" dir="ltr" placeholder="09XXXXXXXXX" id="otp-identifier"></div>
            <button type="button" class="btn btn-primary btn-block btn-lg" id="otp-login-btn" style="margin-top:var(--space-4)">ارسال کد تأیید و ورود</button>
          </div>
        </form>
        <div class="auth-divider">یا</div>
        <button id="otp-toggle" class="btn btn-secondary btn-block auth-otp-btn">ورود با کد یکبار مصرف</button>
        <div class="auth-box__footer">حساب کاربری ندارید؟ <a href="/register">ثبت‌نام کنید</a></div>
        <div class="auth-trust"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>ورود شما با اتصال امن محافظت می‌شود</div>
      </div>
    </div>
  </main>
