<style>
body{font-family:Vazirmatn,system-ui,sans-serif;background:var(--bg-body);color:var(--text-primary);margin:0}
.co-wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.co-brand__logo{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:8px}.co-brand__logo svg{width:22px;height:22px}.co-brand__logo img{max-height:28px;width:auto}.co-brand{text-align:center;margin:12px 0 20px;font-weight:800;font-size:22px;color:var(--text-primary)}
.co-steps{display:flex;gap:8px;margin-bottom:20px}
.co-step{flex:1;text-align:center;font-size:12px;color:var(--text-muted)}
.co-step i{display:flex;align-items:center;justify-content:center;width:30px;height:30px; border-radius: var(--radius-circle);background:var(--border-color-light);color:var(--text-secondary);font-style:normal;font-weight:700;margin:0 auto 6px}
.co-step.on{color:var(--text-primary)}.co-step.on i{background:var(--color-primary);color:var(--text-inverse)}
.co-step.done{color:var(--color-success)}.co-step.done i{background:var(--color-success);color:var(--text-inverse)}
.co-card{background:var(--bg-surface);border:1px solid var(--border-color-light); border-radius: var(--radius-2xl);padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.co-card h1{font-size:18px;margin:0 0 4px;color:var(--text-primary)}.co-card p.sub{color:var(--text-muted);font-size:13px;margin:0 0 18px}
.co-summary{background:var(--bg-surface-alt);border:1px solid var(--border-color-light);color:var(--text-secondary); border-radius: var(--radius-xl);padding:12px 14px;font-size:13px;margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.co-summary .row{display:flex;justify-content:space-between}
.co-summary .row.total{font-weight:800;font-size:15px;color:var(--text-primary);border-top:1px solid var(--border-color);padding-top:8px}
.co-summary .row.total span:last-child{color:var(--color-primary)}
.ship-option{display:flex;align-items:center;gap:12px;border:1px solid var(--border-color);color:var(--text-primary); border-radius: var(--radius-lg);padding:13px 14px;margin-bottom:10px;cursor:pointer;font-size:14px}
.ship-option:hover{border-color:var(--color-primary)}
.ship-option.is-active{border-color:var(--color-primary);background:var(--color-primary-50)}
.ship-option input{accent-color:var(--color-primary)}
.ship-option .cost{margin-right:auto;font-weight:700;white-space:nowrap}
.ship-option .free{margin-right:auto;font-weight:700;color:var(--color-success);white-space:nowrap}
.ship-option small{display:block;color:var(--text-muted);font-size:12px}
.err{font-size:12px;color:var(--color-danger);min-height:16px}
.co-nav{display:flex;gap:12px;margin-top:8px}
/* .btn sizing lives in assets/css/pages.css (.co-wrap .btn) */
.btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-dark)}
.btn-primary:hover{background:var(--color-primary-light);border-color:var(--color-primary-light)}
.btn-ghost{background:var(--color-white);border-color:var(--color-primary);color:var(--color-primary)}
.btn-ghost:hover{background:var(--color-primary-50)}
.btn:disabled{opacity:.6;cursor:wait}
.free{color:var(--color-success)}

<body>
<div class="co-wrap">
<div class="co-brand" data-setting="store.name"><span class="co-brand__logo" data-store-logo><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span><span class="co-brand__name">کمزی</span></div>
<div class="co-steps">
<div class="co-step done"><i>✓</i>اطلاعات مشتری</div>
<div class="co-step done"><i>✓</i>آدرس ارسال</div>
<div class="co-step on"><i>۳</i>روش ارسال</div>
<div class="co-step"><i>۴</i>پرداخت</div>
</div>
<div class="co-card">
<h1>روش ارسال</h1>
<p class="sub">آدرس ثبت شد. روش تحویل سفارش را انتخاب کنید.</p>
<div class="co-summary" id="co-summary"><div class="row"><span>در حال محاسبه...</span></div></div>
<form id="step3-form" novalidate>
<div id="ship-list"></div>
<div class="err" id="e-ship"></div>
<div class="co-nav">
<a class="btn btn-ghost" href="/checkout/step2" style="flex:0 0 auto;padding:13px 18px;font-size:14px;text-decoration:none;text-align:center">بازگشت به مرحله قبل</a><button class="btn btn-primary" type="submit">ادامه به پرداخت</button>
</div>
<div style="margin-top:12px"><a class="btn btn-ghost" href="/cart" style="display:block;text-align:center;text-decoration:none">بازگشت به سبد خرید</a></div></form>
</div>
</div>
<script>
/* Standalone checkout step — intentionally NO common.js (no site header/footer injection). */
(function(){
var K='as_checkout_draft';
function load(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}}
function save(d){localStorage.setItem(K,JSON.stringify(d))}
function readJSON(k,fb){try{var v=JSON.parse(localStorage.getItem(k));return v==null?fb:v}catch(e){return fb}}
if(!load().mobile){location.href='/checkout/step1';return}
if(!load().postalCode){location.href='/checkout/step2';return}
/* Same cart source as the site: user-scoped or guest-scoped key (see common.js). */
function cartItems(){
  var user=null;try{var s=JSON.parse(localStorage.getItem('as_session'));if(s&&s.userId)user=s.user||{id:s.userId};}catch(e){}
  var keys=user?['as_user_'+user.id+'_cart']:[];
  var g=null;try{g=localStorage.getItem('as_guest_session');}catch(e){}
  if(g)keys.push('as_guest_cart_'+g);
  for(var i=0;i<keys.length;i++){var c=readJSON(keys[i],null);if(Array.isArray(c)&&c.length)return c;}
  return [];
}
function parseNum(v,fb){var n=Math.round(Number(String(v==null?'':v).replace(/[^0-9.-]/g,'')));return (isFinite(n)&&n>=0)?n:fb;}
function fa(n){try{return Number(n).toLocaleString('fa-IR')}catch(e){return String(n)}}
var cart=cartItems();
var subtotal=cart.reduce(function(s,it){return s+(Number(it.price)||0)*(Number(it.quantity)||0);},0);
var Settings={cost:35000,freeFrom:500000,method:''};
var Methods=[];
function isFree(total){return Settings.freeFrom>0?total>=Settings.freeFrom:false;}
function costFor(m){if(isFree(subtotal))return 0;return Math.max(0,Math.round(Number(m.cost)||0));}
function current(){var d=load();var m=null;
  if(d.shippingId!=null)m=Methods.find(function(x){return String(x.id)===String(d.shippingId);});
  if(!m)m=Methods.find(function(x){return x.isDefault;});
  if(!m&&Settings.method)m=Methods.find(function(x){return x.name===Settings.method;});
  return m||Methods[0]||null;}
function render(){
  var box=document.getElementById('co-summary');
  box.innerHTML='<div class="row"><span>جمع سبد خرید ('+fa(cart.reduce(function(s,it){return s+(Number(it.quantity)||0);},0))+' قلم)</span><span>'+fa(subtotal)+' تومان</span></div>'
    +(Settings.freeFrom>0?'<div class="row"><span>ارسال رایگان برای خرید بالای '+fa(Settings.freeFrom)+' تومان</span></div>':'');
  var host=document.getElementById('ship-list');
  var cur=current();
  host.innerHTML=Methods.map(function(m){
    var c=costFor(m);var on=cur&&String(cur.id)===String(m.id);
    return '<label class="ship-option'+(on?' is-active':'')+'"><input type="radio" name="ship" value="'+m.id+'"'+(on?' checked':'')+'>'
      +'<span><b>'+m.name+'</b>'+(m.description?'<small>'+m.description+'</small>':'')+'</span>'
      +'<span class="'+(c===0?'free':'cost')+'">'+(c===0?'رایگان':fa(c)+' تومان')+'</span></label>';
  }).join('');
  host.querySelectorAll('input[name="ship"]').forEach(function(r){
    r.addEventListener('change',function(){
      host.querySelectorAll('.ship-option').forEach(function(l){l.classList.remove('is-active');});
      r.closest('.ship-option').classList.add('is-active');
      var d=load();d.shippingId=r.value;save(d);render();
    });
  });
}
function boot(){
  render();
  document.getElementById('step3-form').addEventListener('submit',function(e){
    e.preventDefault();
    var sel=document.querySelector('input[name="ship"]:checked');
    if(!sel){document.getElementById('e-ship').textContent='یک روش ارسال انتخاب کنید.';return;}
    var d=load();d.shippingId=sel.value;save(d);
    location.href='/checkout/step4';
  });
}
Promise.all([
  fetch('/api/settings').then(function(r){return r.json();}).catch(function(){return null;}),
  fetch('/api/shipping-methods').then(function(r){return r.json();}).catch(function(){return [];})
]).then(function(parts){
  var s=parts[0],methods=parts[1];
  if(s){
    Settings.cost=parseNum(s['ship.cost'],Settings.cost);
    Settings.freeFrom=parseNum(s['ship.free_from'],Settings.freeFrom);
    Settings.method=String(s['ship.method']||'');
  }
  if(Array.isArray(methods)&&methods.length){
    Methods=methods.map(function(m){return{id:m.id,name:m.name,description:m.description||'',cost:Math.max(0,Math.round(Number(m.cost)||0)),isDefault:!!m.isDefault};});
  }else{
    Methods=[
      {id:'normal',name:'ارسال عادی',description:'تحویل ۳ تا ۵ روز کاری',cost:0,isDefault:true},
      {id:'express',name:'ارسال سریع',description:'تحویل ۱ تا ۲ روز کاری',cost:Settings.cost,isDefault:false}
    ];
  }
  boot();
}).catch(function(){boot();});
})();
</script>
