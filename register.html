<body class="auth-standalone">
  <header id="site-header" aria-hidden="true"></header>
  <div id="mobile-header" class="mobile-header" aria-hidden="true"></div>
  <main>
    <div class="auth-page">
      <div class="auth-box">
        <a class="auth-back" href="/"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>بازگشت به فروشگاه</a>
        <div class="auth-brand"><span class="auth-brand__badge" data-store-logo><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span><span class="auth-brand__name" data-setting="store.name">کمزی</span><span class="auth-brand__tag">کمزی | فروشگاه تخصصی دوربین مداربسته و سیستم‌های امنیتی</span></div>
        <h2 class="auth-box__title">ایجاد حساب کاربری</h2>
        <p class="auth-subtitle">فقط در چند ثانیه عضو شوید و سفارش دهید.</p>
        <form id="register-form">
          <div class="form-row"><div class="form-group"><label class="input-label">نام</label><input class="input" id="reg-firstname" required placeholder="نام"></div><div class="form-group"><label class="input-label">نام خانوادگی</label><input class="input" id="reg-lastname" required placeholder="نام خانوادگی"></div></div>
          <div class="form-group"><label class="input-label">شماره موبایل</label><input class="input" dir="ltr" type="tel" placeholder="09XXXXXXXXX" id="reg-mobile" required></div>
          <div class="form-group"><label class="input-label">ایمیل (اختیاری)</label><input class="input" dir="ltr" type="email" placeholder="email@example.com" id="reg-email"></div>
          <div class="form-group"><label class="input-label">رمز عبور</label><input class="input" type="password" id="reg-password" placeholder="حداقل ۸ کاراکتر" required minlength="8"></div>
          <div class="form-group"><label class="input-label">تکرار رمز عبور</label><input class="input" type="password" id="reg-password-confirm" placeholder="تکرار رمز عبور" required></div>
          <label class="filter-option" style="margin-top:var(--space-2);padding:0"><input type="checkbox" id="reg-terms" required><span style="font-size:var(--font-size-sm)">شرایط و قوانین را مطالعه کرده و می‌پذیرم</span></label>
          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--space-4)">ثبت‌نام</button>
        </form>
        <div class="auth-box__footer">قبلاً ثبت‌نام کرده‌اید؟ <a href="/login">ورود</a></div>
        <div class="auth-trust"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>اطلاعات شما محرمانه می‌ماند</div>
      </div>
    </div>
  </main>
