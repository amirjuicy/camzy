<script>
(function(){
var el=document.getElementById('brands-list');
if(!el)return;
function render(){
el.innerHTML=AppData.brands.map(function(b){
var logoHtml = b.logo ? '<img class="brand-page-card__img" src="'+b.logo+'" alt="'+b.displayName+'" loading="eager">' : '<span class="brand-page-card__text-logo">'+b.displayName+'</span>';
return '<a href="/brand/'+b.name+'" class="brand-page-card"><div class="brand-page-card__logo">'+logoHtml+'</div><div class="brand-page-card__name">'+b.displayName+'</div><div class="brand-page-card__country">'+b.country+'</div></a>';
}).join('');
}
render();
try{
if(AppData.catalogReady&&AppData.catalogReady.then)AppData.catalogReady.then(render);
document.addEventListener('camzy:catalog-updated',render);
}catch(e){}
})();
</script>
