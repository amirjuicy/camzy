<script>
(function(){
var el=document.getElementById('article-content');
if(!el)return;
var params=new URLSearchParams(window.location.search);
// Clean URL (/article/:ref) carries id-or-slug in the pathname.
var pathRef=(function(){ try{ var s=(window.location.pathname||'').split('/').filter(function(x){ return !!x; }); if(s.length===2 && s[0]==='article' && s[1]) return decodeURIComponent(s[1]); }catch(e){} return ''; })();
var id=parseInt(params.get('id')||(/^\d+$/.test(pathRef)?pathRef:''))||1;
var article=AppData.articles.find(function(a){return a.id===id;})||AppData.articles[0];
function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function faDate(ts){ try{ if(!ts) return ''; var d=new Date(String(ts).trim().replace(' ','T')); if(isNaN(d.getTime())) return ''; return d.toLocaleDateString('fa-IR'); }catch(e){ return ''; } }
function heroHtml(a){ var img=a.image||a.featuredImage||''; return img?'<img src="'+escH(img)+'" alt="'+escH(a.title||'')+'" style="width:100%;max-height:420px;object-fit:cover;border-radius:var(--radius-xl)" onerror="this.style.display=\'none\'">':'<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.3"/><path d="M21 15l-5-5-10 10"/></svg>'; }
function paint(a){
document.title=a.title+(window.__storeName ? ' | ' + window.__storeName : '');
try{ if(window.App&&window.App.upsertJsonLd){ var abs=window.App.absUrl||function(u){return u;};
window.App.upsertJsonLd('camzy-article-schema',{'@context':'https://schema.org','@type':'Article','headline':a.title,'description':a.excerpt||'','image':abs(a.image||''),'author':{'@type':'Person','name':a.author||'تیم تحریریه کمزی'},'publisher':{'@type':'Organization','name':'کمزی','logo':{'@type':'ImageObject','url':abs('/assets/images/brand/logo.svg')}},'datePublished':a.createdAt||a.date||'','mainEntityOfPage':abs('/article/'+encodeURIComponent(a.id)),'articleSection':a.category||''});
window.App.upsertJsonLd('camzy-breadcrumb-schema',{'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'خانه','item':abs('/')},{'@type':'ListItem','position':2,'name':'مقالات','item':abs('/articles')},{'@type':'ListItem','position':3,'name':a.title,'item':abs('/article/'+encodeURIComponent(a.id))}]});
} }catch(e){}
el.innerHTML='<div class="breadcrumb"><div class="container"><div class="breadcrumb-list"><span class="breadcrumb-item"><a href="/">خانه</a></span><span class="breadcrumb-sep">›</span><span class="breadcrumb-item"><a href="/articles">مقالات</a></span><span class="breadcrumb-sep">›</span><span class="breadcrumb-item breadcrumb-item--active">'+a.title+'</span></div></div></div><article class="article-detail"><span class="article-detail__category">'+a.category+'</span><h1 class="article-detail__title">'+a.title+'</h1><div class="article-detail__meta"><span>'+a.author+'</span><span>'+a.date+'</span><span>'+a.readTime+' مطالعه</span></div><div class="article-detail__hero">'+heroHtml(a)+'</div><div class="article-detail__content">'+a.content+'</div><div style="display:flex;gap:8px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-color-light)"><span style="font-size:12px;color:var(--text-muted)">اشتراک‌گذاری:</span><button class="btn btn-ghost btn-sm" onclick="App.showToast(\'کپی لینک (شبیه‌سازی)\',\'info\')">کپی لینک</button></div></article><div style="max-width:1120px;margin:0 auto;padding:0 16px"><div style="display:flex;align-items:center;gap:8px;margin:24px 0 14px"><span style="width:3px;height:16px;background:var(--color-primary);border-radius:var(--radius-full)"></span><h2 style="font-size:15px;font-weight:700">مقالات مرتبط</h2></div><div class="blog-grid" id="related-articles"></div></div>';
var related=document.getElementById('related-articles');
if(related){related.innerHTML=AppData.articles.filter(function(a){return a.id!==article.id&&a.categorySlug===article.categorySlug;}).slice(0,3).concat(AppData.articles.filter(function(a){return a.id!==article.id&&a.categorySlug!==article.categorySlug;}).slice(0,3)).slice(0,3).map(function(a){ var im=a.image||a.featuredImage||''; var m=im?'<img src="'+escH(im)+'" alt="'+escH(a.title||'')+'" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'">':'<div class="blog-card__media-placeholder"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.3"/><path d="M21 15l-5-5-10 10"/></svg></div>'; return '<div class="blog-card" onclick="window.location.href=\'/article/'+a.id+'\'"><div class="blog-card__media">'+m+'<span class="blog-card__cat">'+a.category+'</span></div><div class="blog-card__body"><h3 class="blog-card__title">'+a.title+'</h3><div class="blog-card__meta"><span>'+a.date+'</span><span>· '+a.readTime+'</span></div></div></div>';}).join('');}
}
paint(article);
var slugP=new URLSearchParams(window.location.search).get('slug')||pathRef;
var key=slugP||String(id);
fetch('/api/articles/'+encodeURIComponent(key)).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
  if(!d||!d.title) return;
  article=Object.assign({}, article, { title:d.title, excerpt:d.excerpt||article.excerpt, content:d.content||article.content, image:d.image||d.featuredImage||article.image, featuredImage:d.image||d.featuredImage||article.featuredImage, date:faDate(d.createdAt||d.created_at)||article.date, createdAt:d.createdAt||d.created_at||article.createdAt });
  paint(article);
}).catch(function(){});
})();
</script>
