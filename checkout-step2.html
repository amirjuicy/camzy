<style>
body{font-family:Vazirmatn,system-ui,sans-serif;background:var(--bg-body);color:var(--text-primary);margin:0}
.co-wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.co-brand__logo{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:8px}.co-brand__logo svg{width:22px;height:22px}.co-brand__logo img{max-height:28px;width:auto}.co-brand{text-align:center;margin:12px 0 20px;font-weight:800;font-size:22px;color:var(--text-primary)}
.co-steps{display:flex;gap:8px;margin-bottom:20px}
.co-step{flex:1;text-align:center;font-size:12px;color:var(--text-muted)}
.co-step i{display:flex;align-items:center;justify-content:center;width:30px;height:30px; border-radius: var(--radius-circle);background:var(--border-color-light);color:var(--text-secondary);font-style:normal;font-weight:700;margin:0 auto 6px}
.co-step.on{color:var(--text-primary)}.co-step.on i{background:var(--color-primary);color:var(--text-inverse)}
.co-step.done{color:var(--color-success)}.co-step.done i{background:var(--color-success);color:var(--text-inverse)}
.co-card{background:var(--bg-surface);border:1px solid var(--border-color-light); border-radius: var(--radius-2xl);padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.co-card h1{font-size:18px;margin:0 0 4px;color:var(--text-primary)}.co-card p.sub{color:var(--text-muted);font-size:13px;margin:0 0 18px}
.form-row{display:flex;gap:12px}.form-row .form-group{flex:1}
.form-group{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.input-label{font-size:13px;font-weight:600;color:var(--text-primary)}
textarea.input{resize:vertical}
.err{font-size:12px;color:var(--color-danger);min-height:16px}
.co-nav{display:flex;gap:12px;margin-top:8px}
/* .btn sizing lives in assets/css/pages.css (.co-wrap .btn) */
.btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-dark)}
.btn-primary:hover{background:var(--color-primary-light);border-color:var(--color-primary-light)}
.btn-ghost{background:var(--color-white);border-color:var(--color-primary);color:var(--color-primary)}
.btn-ghost:hover{background:var(--color-primary-50)}
@media(max-width:560px){.form-row{flex-direction:column}}

<body>
<div class="co-wrap">
<div class="co-brand" data-setting="store.name"><span class="co-brand__logo" data-store-logo><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span><span class="co-brand__name">کمزی</span></div>
<div class="co-steps">
<div class="co-step done"><i>✓</i>اطلاعات مشتری</div>
<div class="co-step on"><i>۲</i>آدرس ارسال</div>
<div class="co-step"><i>۳</i>روش ارسال</div>
<div class="co-step"><i>۴</i>پرداخت</div>
</div>
<div class="co-card">
<h1>آدرس ارسال</h1>
<p class="sub">اطلاعات مشتری ثبت شد. حالا آدرس تحویل را وارد کنید.</p>
<form id="step2-form" novalidate>
<div class="form-row">
<div class="form-group"><label class="input-label">استان *</label><select class="input" id="f-province"></select><span class="err" id="e-province"></span></div>
<div class="form-group"><label class="input-label">شهر *</label><select class="input" id="f-city"></select><span class="err" id="e-city"></span></div>
</div>
<div class="form-group"><label class="input-label">آدرس کامل *</label><textarea class="input" id="f-address" rows="3" placeholder="آدرس کامل پستی..."></textarea><span class="err" id="e-address"></span></div>
<div class="form-row">
<div class="form-group"><label class="input-label">کد پستی *</label><input class="input" id="f-postalCode" dir="ltr" placeholder="XXXXXXXXXX" inputmode="numeric"><span class="err" id="e-postalCode"></span></div>
<div class="form-group"><label class="input-label">نام تحویل‌گیرنده</label><input class="input" id="f-receiverName" placeholder="نام تحویل‌گیرنده"><span class="err"></span></div>
</div>
<div class="form-group"><label class="input-label">شماره تماس تحویل‌گیرنده</label><input class="input" id="f-receiverPhone" dir="ltr" placeholder="09XXXXXXXXX" inputmode="numeric"><span class="err" id="e-receiverPhone"></span></div>
<div class="co-nav">
<a class="btn btn-ghost" href="/checkout/step1" style="flex:0 0 auto;padding:13px 18px;font-size:14px;text-decoration:none;text-align:center">بازگشت به مرحله قبل</a><button class="btn btn-primary" type="submit">ادامه به روش ارسال</button>
</div>
<div style="margin-top:12px"><a class="btn btn-ghost" href="/cart" style="display:block;text-align:center;text-decoration:none">بازگشت به سبد خرید</a></div></form>
</div>
</div>
<script src="assets/js/iran-cities.js"></script>
<script>
/* Standalone checkout step — intentionally NO common.js (no site header/footer injection). */
(function(){
var K='as_checkout_draft';
function load(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}}
function save(d){localStorage.setItem(K,JSON.stringify(d))}
if(!load().mobile){location.href='/checkout/step1';return}
function provs(){return window.IranCities||[]}
function fillCities(p,c){var el=document.getElementById('f-city');var pr=provs().find(function(x){return x.name===p});el.innerHTML='<option value="">انتخاب شهر</option>'+(pr?pr.cities.map(function(ct){return '<option value="'+ct+'"'+(ct===c?' selected':'')+'>'+ct+'</option>'}).join(''):'')}
function renderProvinces(sel){var el=document.getElementById('f-province');el.innerHTML='<option value="">انتخاب استان</option>'+provs().map(function(p){return '<option value="'+p.name+'"'+(p.name===sel?' selected':'')+'>'+p.name+'</option>'}).join('')}
function init(d){
renderProvinces(d.province||'');fillCities(d.province||'',d.city||'');
['address','postalCode','receiverName','receiverPhone'].forEach(function(k){if(d[k])document.getElementById('f-'+k).value=d[k]});
document.getElementById('f-province').addEventListener('change',function(){fillCities(this.value,'')});
}
function boot(){
var d=load();init(d);
document.getElementById('step2-form').addEventListener('submit',function(e){
e.preventDefault();var ok=true;
function setErr(id,msg){document.getElementById(id).textContent=msg||'';if(msg)ok=false}
var v=function(id){return document.getElementById(id).value.trim()};
setErr('e-province',v('f-province')?'':'استان را انتخاب کنید.');
setErr('e-city',v('f-city')?'':'شهر را انتخاب کنید.');
setErr('e-address',v('f-address')&&v('f-address').length>=10?'':'آدرس کامل (حداقل ۱۰ نویسه) الزامی است.');
setErr('e-postalCode',/^\d{10}$/.test(v('f-postalCode'))?'':'کد پستی ۱۰ رقمی وارد کنید.');
var rp=v('f-receiverPhone');
setErr('e-receiverPhone',(rp&&!/^09\d{9}$/.test(rp))?'شماره تحویل‌گیرنده معتبر نیست.':'');
if(!ok)return;
var cur=load();
cur.province=v('f-province');cur.city=v('f-city');cur.address=v('f-address');cur.postalCode=v('f-postalCode');cur.receiverName=v('f-receiverName');cur.receiverPhone=rp;
save(cur);
location.href='/checkout/step3';
});
}
if(provs().length){boot();return}
if(window.IranCitiesLoader){window.IranCitiesLoader.load(function(){boot()});return}
fetch('assets/data/iran-cities.json').then(function(r){return r.json()}).then(function(j){try{window.IranCities=j}catch(e){}boot()}).catch(function(){boot()});
})();
</script>
  <script src="assets/js/store-logo.js?v=1"></script>
<script src="assets/js/select-enhancer.js"></script>
<script src="assets/js/site-content.js"></script>
</body>
