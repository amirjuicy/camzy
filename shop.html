<body>
  <header id="site-header"></header>
  <div id="mobile-header" class="mobile-header"></div>
  <main>
    <div class="breadcrumb"><div class="container"><div class="breadcrumb-list">
      <span class="breadcrumb-item"><a href="/">خانه</a></span>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-item breadcrumb-item--active">فروشگاه</span>
    </div></div></div>
    <div class="page-header"><div class="container">
      <h1 class="page-header__title" id="page-title">فروشگاه</h1>
      <p class="page-header__desc" id="page-desc">مجموعه کامل محصولات <span data-setting="store.name">کمزی</span></p>
      <p class="page-header__count"><span id="product-count"></span></p>
    </div></div>
    <div class="container">
      <div class="shop-layout">
        <aside class="shop-sidebar">
          <button id="filter-toggle" class="shop-filter-toggle" style="display:none">فیلترها</button>
          <button id="filter-close" class="filter-close-btn" aria-label="بستن فیلترها">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <div class="shop-sidebar__section">
            <h3 class="shop-sidebar__title">جستجو در محصولات</h3>
            <div class="search-input-wrapper"><input type="text" class="search-input" id="shop-search" placeholder="نام محصول..."><span class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span></div>
          </div>
          <div class="shop-sidebar__section">
            <h3 class="shop-sidebar__title">دسته‌بندی</h3>
            <div id="filter-categories"></div>
          </div>
          <div class="shop-sidebar__section">
            <h3 class="shop-sidebar__title">برند</h3>
            <div id="filter-brands"></div>
          </div>
          <div class="shop-sidebar__section">
            <h3 class="shop-sidebar__title">محدوده قیمت</h3>
            <div class="price-range">
              <input type="number" class="input input-sm" id="price-min" placeholder="از">
              <span class="price-range__sep">تا</span>
              <input type="number" class="input input-sm" id="price-max" placeholder="تا">
            </div>
            <button class="btn btn-primary btn-sm btn-block" id="price-filter-btn" style="margin-top:var(--space-2)">اعمال قیمت</button>
          </div>
          <div class="shop-sidebar__section">
            <label class="filter-option"><input type="checkbox" id="filter-stock"><span>فقط موجود در انبار</span></label>
          </div>
          <button class="btn btn-ghost btn-block btn-sm" onclick="ShopFilter.clearFilters()">پاک کردن فیلترها</button>
        </aside>
        <div>
          <div class="shop-toolbar">
            <button id="filter-toggle-mobile" class="shop-filter-toggle"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> فیلترها</button>
            <div class="shop-toolbar__actions">
              <select class="shop-sort" id="shop-sort">
                <option value="relevance">مرتب‌سازی: مرتبط‌ترین</option>
                <option value="newest">جدیدترین</option>
                <option value="bestseller">پرفروش‌ترین</option>
                <option value="cheapest">ارزان‌ترین</option>
                <option value="expensive">گران‌ترین</option>
              </select>
            </div>
          </div>
          <div class="product-listing-grid" id="shop-products-grid"></div>
          <div id="pagination" class="pagination"></div>
        </div>
      </div>
    </div>
