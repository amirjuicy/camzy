<body>
  <header id="site-header"></header>
  <div id="mobile-header" class="mobile-header"></div>
  <main>
    <div class="auth-page">
      <div class="auth-box">
        <div class="auth-box__logo" data-setting="store.name"><span data-store-logo style="width:40px;height:40px;background:var(--color-primary);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;color:white"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span><span style="font-weight:var(--font-weight-black);font-size:var(--font-size-lg);color:var(--color-primary)">کمزی</span></div>
        <h2 class="auth-box__title">بازیابی رمز عبور</h2>
        <form id="forgot-form">
          <div id="forgot-step-1">
            <p style="font-size:var(--font-size-sm);color:var(--text-secondary);margin-bottom:var(--space-4);text-align:center">شماره موبایل یا ایمیل خود را وارد کنید تا کد تأیید برایتان ارسال شود.</p>
            <div class="form-group"><label class="input-label">موبایل یا ایمیل</label><input class="input" dir="ltr" placeholder="شماره موبایل یا ایمیل" id="forgot-identifier" required></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--space-4)">ارسال کد تأیید</button>
          </div>
          <div id="forgot-step-2" style="display:none">
            <p style="font-size:var(--font-size-sm);color:var(--text-secondary);margin-bottom:var(--space-4);text-align:center">کد تأیید ۵ رقمی ارسال شد. کد را وارد کنید.</p>
            <div class="form-group"><label class="input-label">کد تأیید</label><input class="input" dir="ltr" placeholder="۵ رقمی" required maxlength="5" style="text-align:center;font-size:var(--font-size-xl);letter-spacing:8px"></div>
            <div class="form-group" style="margin-top:var(--space-4)"><label class="input-label">رمز عبور جدید</label><input class="input" type="password" placeholder="رمز عبور جدید" required></div>
            <div class="form-group" style="margin-top:var(--space-4)"><label class="input-label">تکرار رمز عبور</label><input class="input" type="password" placeholder="تکرار رمز عبور" required></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--space-4)">تغییر رمز عبور</button>
          </div>
        </form>
        <div class="auth-box__footer"><a href="/login">بازگشت به صفحه ورود</a></div>
      </div>
    </div>
  </main>
