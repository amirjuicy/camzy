<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Cart Shift</title>
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/desktop.css">
  <link rel="stylesheet" href="assets/css/pwa.css">
  <style>
    .test-results {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      border: 1px solid #ccc;
      padding: 20px;
      max-width: 400px;
      max-height: 80vh;
      overflow: auto;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      font-family: monospace;
      font-size: 12px;
    }
    .test-results h3 { margin: 0 0 10px; font-size: 14px; }
    .test-results pre { margin: 5px 0; white-space: pre-wrap; }
    .pass { color: green; }
    .fail { color: red; }
    .measurement { background: #f5f5f5; padding: 5px; margin: 5px 0; border-radius: 4px; }
  </style>
</head>
<body>
  <main style="padding: 100px 20px 200px;">
    <div class="dk-buybox-wrap" style="max-width: 340px; margin: 0 auto;">
      <div class="dk-buybox" data-testid="buy-box">
        <div class="dk-buybox__price-cart">
          <div class="dk-buybox__price">
            <div class="dk-buybox__final-price" id="product-detail-price">
              <span class="dk-buybox__amount">۱,۲۳۴,۵۶۷</span>
              <svg style="width:14px;height:14px;fill:currentColor"><use xlink:href="#toman"></use></svg>
            </div>
          </div>
          <div class="dk-buybox__cart" id="product-cart-control">
            <button class="dk-buybox__add-btn" id="product-add-to-cart" onclick="simulateAddToCart()">
              <span>افزودن به سبد خرید</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="test-results" id="results">
    <h3>Measurements</h3>
    <div id="output"></div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/product.js"></script>
  <script>
    function getRectInfo(el) {
      if (!el) return null;
      const rect = el.getBoundingClientRect();
      return {
        left: rect.left.toFixed(1),
        top: rect.top.toFixed(1),
        width: rect.width.toFixed(1),
        height: rect.height.toFixed(1)
      };
    }

    function log(label, before, after) {
      const output = document.getElementById('output');
      const div = document.createElement('div');
      div.className = 'measurement';
      const samePos = (before.left === after.left && before.top === after.top);
      const sameSize = (before.width === after.width && before.height === after.height);
      const pass = samePos && sameSize;
      div.innerHTML = `
        <strong>${label}</strong> ${pass ? '<span class="pass">✓ PASS</span>' : '<span class="fail">✗ FAIL</span>'}
        <pre>Before: left=${before.left} top=${before.top} width=${before.width} height=${before.height}</pre>
        <pre>After:  left=${after.left} top=${after.top} width=${after.width} height=${after.height}</pre>
        ${!samePos ? '<span class="fail">Position shifted!</span>' : ''}
        ${!sameSize ? '<span class="fail">Size changed!</span>' : ''}
      `;
      output.appendChild(div);
    }

    function simulateAddToCart() {
      const cartControl = document.getElementById('product-cart-control');
      const addBtn = document.getElementById('product-add-to-cart');
      
      // Measure before
      const cartRectBefore = getRectInfo(cartControl);
      const btnRectBefore = getRectInfo(addBtn);
      
      // Simulate the add to cart - replace with qty selector + cart link
      cartControl.innerHTML = `
        <div class="flex items-center w-full">
          <div class="qty-selector qty-selector--buybox" role="group" aria-label="تعداد محصول در سبد خرید">
            <button type="button" class="qty-selector__btn qty-selector__btn--minus" onclick="updateQty(-1)" aria-label="کاهش تعداد">−</button>
            <span class="qty-selector__value" id="product-qty">۱</span>
            <button type="button" class="qty-selector__btn qty-selector__btn--plus" onclick="updateQty(1)" aria-label="افزایش تعداد">+</button>
          </div>
          <div class="mr-2 lg:mr-4 hidden lg:block shrink-0">
            <p class="text-neutral-700 text-body-1">در سبد شما</p>
            <div class="flex items-center">مشاهده<a class="text-secondary-500" href="/checkout/cart/"><span class="mr-1 text-body-2">سبد خرید</span></a></div>
          </div>
        </div>
      `;
      
      // Force reflow
      cartControl.offsetHeight;
      
      // Measure after
      const cartRectAfter = getRectInfo(cartControl);
      const qtyEl = document.querySelector('.qty-selector--buybox');
      const qtyRectAfter = getRectInfo(qtyEl);
      
      log('#product-cart-control', cartRectBefore, cartRectAfter);
      log('Button/Qty Selector', btnRectBefore, qtyRectAfter);
    }

    function updateQty(delta) {
      const qtyEl = document.getElementById('product-qty');
      let qty = parseInt(qtyEl.textContent.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
      qty = Math.max(1, qty + delta);
      qtyEl.textContent = qty.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    // Also test on mobile viewport
    function testMobile() {
      // We'll just log current viewport
      console.log('Viewport:', window.innerWidth, 'x', window.innerHeight);
    }
    
    testMobile();
  </script>
</body>
</html>
